version: '3.8'
services:
  api:
    build:
      context: ../../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinelx.db
    volumes:
      - ../../:/app
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
