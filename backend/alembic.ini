# Alembic migration configuration for CyberShield.
#
# The connection URL is intentionally left empty here: the async env.py builds
# it from application settings (DATABASE_URL) so migrations and the API always
# agree on the target database.

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is populated by alembic/env.py from app.core.config.get_settings().
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S