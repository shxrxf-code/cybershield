# =============================================================================
# CyberShield reverse proxy (nginx)
# =============================================================================
# Mounted as /etc/nginx/nginx.conf by the `nginx` service
# (infrastructure/docker-compose.yml, profile "proxy").
#
# The API must run with TRUST_PROXY_HEADERS=true in this topology (already set
# in docker-compose.yml) — this config overwrites X-Forwarded-For/X-Forwarded-Proto.
#
# TLS with certbot:
#   1. Point DNS (e.g. scan.example.com) at this host.
#   2. `docker compose --profile proxy up -d` — the HTTP server below serves
#      the API immediately, which is enough for LAN / non-internet exposure.
#   3. Obtain certificates (see infrastructure/nginx/README.md for container
#      and host one-liners):
#        certbot certonly --webroot -w /var/www/certbot -d scan.example.com
#   4. Uncomment the TLS server block below, set `server_name` and the cert
#      paths, and change the HTTP block to the redirect version.
#
# Notes:
#   * client_max_body_size 110m (> MAX_UPLOAD_BYTES 100 MiB + multipart overhead).
#   * `proxy_request_buffering off` streams large uploads to uvicorn instead of
#     buffering them; scoped to this location so file uploads behave well.
#   * $request_id (nginx built-in) is forwarded so the API echoes it as
#     X-Request-ID for end-to-end correlation.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # JSON/OpenAPI/document payloads; never re-compress already-compressed types.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Upstream must match the compose service name: the api container at :8000.
    upstream cybershield_api {
        server api:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Plain HTTP — works out of the box for LAN / local / behind another LB.
    # For internet exposure uncomment the TLS block below and use the redirect
    # variant of this server.
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 100 MiB app limit + headroom for multipart/email uploads.
        client_max_body_size 110m;

        location / {
            proxy_pass http://cybershield_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # End-to-end request correlation.
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering off;

            proxy_redirect off;
        }

        # Security headers — `always` also applies them to 4xx/5xx responses.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ---------------------------------------------------------------------------
    # TLS — uncomment + customise for internet exposure.
    # ---------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #     # server_name scan.example.com;                     # <-- your hostname
    #
    #     ssl_certificate     /etc/letsencrypt/live/scan.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/scan.example.com/privkey.pem;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Emit HSTS only once the cert is demonstrably valid.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     client_max_body_size 110m;
    #
    #     location / {
    #         proxy_pass http://cybershield_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Request-ID $request_id;
    #
    #         proxy_connect_timeout 10s;
    #         proxy_send_timeout 300s;
    #         proxy_read_timeout 300s;
    #         proxy_request_buffering off;
    #
    #         proxy_redirect off;
    #     }
    #
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    # }

    # Redirect variant — swap this in when the TLS block is live:
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name scan.example.com;
    #     return 301 https://$host$request_uri;
    # }
}