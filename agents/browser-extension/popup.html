<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #070a10;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #293542;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.1em;
      color: #43f0a2;
    }
    .badge {
      background: rgba(67, 240, 162, 0.15);
      color: #43f0a2;
      border: 1px solid rgba(67, 240, 162, 0.3);
      padding: 2px 6px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: bold;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #293542;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      background: #43f0a2;
      color: #070a10;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">CYBERSHIELD</div>
    <span class="badge" id="shield-status">ACTIVE</span>
  </div>

  <div class="stat-box">
    <div class="stat-label">Threats Blocked</div>
    <div class="stat-val" id="threats-count">0</div>
  </div>

  <div class="stat-box">
    <div class="stat-label">Current Domain</div>
    <div class="stat-val" style="font-size: 13px; font-family: monospace;" id="current-domain">Checking...</div>
  </div>

  <button class="btn" id="toggle-shield">Toggle Web Guard</button>

  <script src="popup.js"></script>
</body>
</html>
