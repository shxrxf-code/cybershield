name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run backend test suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-0123456789abcdef
        run: python -W ignore -m pytest

  # The standalone detection-engine package is not yet wired into the backend
  # and its own suite is currently red (missing optional `androguard` plus a
  # miscalibrated email brand-impersonation check). It runs informationally
  # until the integrate-or-retire decision in Phase 2; it must not block CI.
  detection-engine:
    name: Detection engine tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install optional analysis extras
        run: pip install "detection-engine/[network,yara,documents,images,ml,crypto]"
      - name: Run standalone engine suite
        run: python -W ignore -m pytest tests/

  client:
    name: Flutter client (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
